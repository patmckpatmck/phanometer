name: Daily Phan-o-meter

on:
  schedule:
    # 10:00 UTC = 06:00 ET (standard) / 05:00 ET (daylight).
    # Runs after most late-night posting is in; before morning readers wake up.
    - cron: '0 10 * * *'
  workflow_dispatch:

permissions:
  contents: write

# A manual trigger while a scheduled run is still going would otherwise race on
# the data/ commit. Queue rather than drop.
concurrency:
  group: daily-phanometer
  cancel-in-progress: false

jobs:
  run:
    runs-on: [self-hosted, macOS, ARM64, phanometer-mini]
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # ffmpeg is installed via brew on the self-hosted Mac runner.
      # No setup-python step: we use the project venv at ~/phanometer/.venv
      # which is pinned to Python 3.12 from /opt/homebrew.

      - name: Install Python dependencies
        run: |
          source ~/phanometer/.venv/bin/activate
          pip install -r requirements.txt

      - name: Run phanometer.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          source ~/phanometer/.venv/bin/activate
          python phanometer.py

      # Build the daily social-media reel from the latest data file. Runs
      # after phanometer.py so the freshly written data/YYYY-MM-DD.json is
      # what gets picked up. Output lands in reels/, which is committed
      # alongside data/ in the next step.
      - name: Build daily reel
        run: |
          source ~/phanometer/.venv/bin/activate
          python reel/build.py

      - name: Commit and push data updates
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ reels/

          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi

          git commit -m "Daily Phan-o-meter update $(date -u +%Y-%m-%d)"

          # main has more than one writer (manual commits land here too), so the
          # push can lose the fast-forward race if main advanced during the run.
          # Rebase our data/reels commit onto the latest remote and retry.
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            echo "push attempt $attempt failed; retrying in 5s" >&2
            sleep 5
          done

          echo "Failed to push after 3 attempts" >&2
          exit 1
